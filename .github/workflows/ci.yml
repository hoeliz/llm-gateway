name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          # No external Go modules yet; include go.sum when one is added.
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test frontend
        working-directory: web
        run: npm test

      # Go embeds this directory: build it before compiling or testing Go.
      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Test Go with race detector
        run: go test -race ./...

      - name: Analyze Go
        run: go vet ./...

      - name: Build gateway
        run: go build -o bin/llm-gateway ./cmd/gateway

      - name: Check committed frontend assets
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- internal/webui/dist)"
          if [[ -n "$changes" ]]; then
            echo "::error::Frontend assets are stale. Run make ui and commit all changes in internal/webui/dist."
            printf '%s\n' "$changes"
            git diff --stat -- internal/webui/dist
            exit 1
          fi
